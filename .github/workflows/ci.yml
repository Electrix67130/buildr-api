# Verification continue Buildr — API.
# Sur chaque push et pull request : typage et suite complete de tests, sans
# deploiement. Le deploiement (deploy.yml) refait la meme verification sur le
# tag ; ici on la voit avant de tagger.
name: CI API

on:
  push:
    branches: [master]
  pull_request: {}

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buildr_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
