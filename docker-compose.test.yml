# Base de donnees jetable pour la suite de tests.
#
# Volontairement sans volume : les donnees ne survivent pas a `down`, ce qui est
# le comportement voulu. Le port 5433 evite toute collision avec la base de
# developpement (5432) — et sert de garde-fou supplementaire : meme mal
# configures, les tests ne peuvent pas se connecter a la base de dev.
services:
  postgres-test:
    image: postgres:17-alpine
    container_name: buildr-postgres-test
    environment:
      POSTGRES_DB: buildr_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d buildr_test']
      interval: 1s
      timeout: 3s
      retries: 30
